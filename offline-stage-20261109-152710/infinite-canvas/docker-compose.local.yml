services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  api:
    image: infinite-canvas-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CANVAS_STORAGE_ALLOWED_ROOTS: ${CANVAS_STORAGE_ALLOWED_ROOTS:-/mnt/smb}
    volumes:
      - ${CANVAS_STORAGE_HOST_ROOT:-/mnt/smb}:${CANVAS_STORAGE_CONTAINER_ROOT:-/mnt/smb}:rw
