services:
  app:
    image: infinite-canvas:custom
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    environment:
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}

  api:
    image: infinite-canvas-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
