name: infinite-canvas-windows

services:
  mysql:
    image: mysql:8.4
    container_name: infinite-canvas-windows-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - canvas_windows_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: infinite-canvas-api:windows
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: infinite-canvas-windows-api
    restart: unless-stopped
    env_file:
      - .env.windows
    environment:
      CANVAS_STORAGE_ALLOWED_ROOTS: /data/canvas
    volumes:
      - ./data/canvas:/data/canvas:rw
    depends_on:
      mysql:
        condition: service_healthy

  app:
    image: infinite-canvas:windows
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: infinite-canvas-windows-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_LOGO_URL: ${COMPANY_LOGO_URL:-/logo.svg}
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
    depends_on:
      - api

volumes:
  canvas_windows_mysql_data:
    name: infinite-canvas-windows-mysql-data
