name: infinite-canvas

services:
  mysql:
    image: mysql:8.4
    container_name: infinite-canvas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - canvas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/douxiyang-prog/infinite-canvas-api:latest
    container_name: infinite-canvas-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

  app:
    image: ghcr.io/douxiyang-prog/infinite-canvas:latest
    container_name: infinite-canvas
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_LOGO_URL: ${COMPANY_LOGO_URL:-/brand/logo.svg}
    volumes:
      - ./brand:/usr/share/nginx/html/brand:ro
    depends_on:
      - api

volumes:
  canvas_mysql_data:
