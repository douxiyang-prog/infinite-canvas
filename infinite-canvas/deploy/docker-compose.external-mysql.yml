name: infinite-canvas

services:
  api:
    image: ghcr.io/douxiyang-prog/infinite-canvas-api:latest
    container_name: infinite-canvas-api
    restart: unless-stopped
    env_file:
      - .env

  app:
    image: ghcr.io/douxiyang-prog/infinite-canvas:latest
    container_name: infinite-canvas
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
